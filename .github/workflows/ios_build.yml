name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Create iOS files if missing
        run: flutter create . --platforms=ios

      - name: Update iOS Deployment Target
        run: |
          cd ios
          echo "platform :ios, '15.5'" > Podfile.new
          cat Podfile >> Podfile.new
          mv Podfile.new Podfile

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign
